<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cronoteca — curiosità storiche</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#171310">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Archivio">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..900&family=Lora:ital,wght@0,400..600;1,400..500&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --paper: #EDE6D6;
  --paper-2: #E3D9C4;
  --ink: #2B2620;
  --ink-soft: #6B5F4E;
  --brass: #8C7A54;
  --brass-faint: rgba(140,122,84,0.28);
  --antichita: #B5622B;
  --medioevo: #4A5D3A;
  --rinascimento: #B8912B;
  --moderna: #33465F;
  --contemporanea: #8B3A3A;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; height:100%; background:var(--ink); overscroll-behavior-y:none;}
body{
  font-family:'Lora', serif;
  color:var(--ink);
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

/* ---------- top bar ---------- */
.topbar{
  position:fixed; top:0; left:0; right:0; z-index:30;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px 10px;
  background:linear-gradient(to bottom, rgba(20,17,13,0.55), rgba(20,17,13,0));
  pointer-events:none;
}
.brand{
  display:flex; align-items:center; gap:8px;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
  color:#EDE6D6;
}
.brand svg{width:15px; height:15px; opacity:0.9;}
.counter{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px; letter-spacing:0.06em;
  color:#EDE6D6;
  background:rgba(20,17,13,0.35);
  border:1px solid rgba(237,230,214,0.25);
  border-radius:20px;
  padding:5px 11px;
  display:flex; align-items:center; gap:6px;
}
.counter .dot-heart{color:#e0a3a3; font-size:12px; line-height:1;}

/* ---------- progress track (trascinabile per scorrere velocemente) ---------- */
.progress-track{
  position:fixed; right:0; top:12%; bottom:12%;
  width:34px; z-index:30;
  display:flex; justify-content:center;
  touch-action:none; cursor:grab;
}
.progress-track::before{
  content:''; position:absolute; top:0; bottom:0; left:50%; transform:translateX(-50%);
  width:3px; border-radius:3px;
  background:rgba(237,230,214,0.18);
}
.progress-thumb{
  position:absolute; left:50%; transform:translateX(-50%); top:0;
  width:8px; height:32px; border-radius:5px;
  background:#8C7A54;
  box-shadow:0 0 8px rgba(0,0,0,0.4);
  transition:background 0.3s ease, width 0.15s ease, height 0.15s ease;
  pointer-events:none;
}
.progress-track.dragging .progress-thumb{
  width:13px; height:42px;
  box-shadow:0 0 14px rgba(0,0,0,0.55);
}
.progress-track.dragging{ cursor:grabbing; }

/* ---------- feed ---------- */
.feed{
  height:100vh; height:100dvh;
  overflow-y:scroll; scroll-snap-type:y mandatory;
  background:var(--ink);
}
.slide{
  height:100vh; height:100dvh;
  scroll-snap-align:start; scroll-snap-stop:always;
  display:flex; align-items:center; justify-content:center;
  position:relative;
  padding:0 22px;
  background:
    radial-gradient(circle at 20% 15%, rgba(255,255,255,0.05), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(255,255,255,0.04), transparent 45%),
    #171310;
}

/* ---------- card ---------- */
.card{
  position:relative;
  width:100%; max-width:400px;
  background:
    radial-gradient(rgba(0,0,0,0.05) 0.6px, transparent 0.6px) 0 0/7px 7px,
    var(--paper);
  border:1px solid var(--brass-faint);
  border-radius:3px;
  box-shadow: 0 18px 40px -12px rgba(0,0,0,0.55), 0 2px 0 rgba(0,0,0,0.15) inset;
  padding:34px 26px 24px;
  transform: translateY(6px);
  opacity:0;
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.slide.in-view .card{ opacity:1; transform:translateY(0); }

/* punch holes */
.card::before, .card::after{
  content:''; position:absolute; top:14px; width:9px; height:9px;
  border-radius:50%;
  background:#171310;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.6);
}
.card::before{ left:24px; }
.card::after{ left:44px; }

/* era tab */
.tab{
  position:absolute; right:-1px; top:var(--tabtop, 56px);
  writing-mode:vertical-rl; text-orientation:mixed;
  font-family:'IBM Plex Mono', monospace;
  font-size:10px; letter-spacing:0.14em; text-transform:uppercase;
  color:#fff;
  padding:10px 5px 12px;
  border-radius:0 4px 4px 0;
  box-shadow: 2px 3px 8px rgba(0,0,0,0.35);
}

.head-row{
  display:flex; align-items:baseline; justify-content:space-between;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px; letter-spacing:0.05em;
  color:var(--ink-soft);
  padding-bottom:10px; margin-bottom:16px;
  border-bottom:1px dashed var(--brass-faint);
}
.head-row .catno{ font-weight:600; }
.head-row .era-label{ color:var(--ink-soft); }

.wiki-source{
  display:inline-flex; align-items:center; gap:4px;
  font-family:'IBM Plex Mono', monospace; font-size:9.5px;
  color:var(--ink-soft); opacity:0.75;
  margin-top:8px;
}
.wiki-source svg{ width:10px; height:10px; }

.title{
  font-family:'Fraunces', serif;
  font-weight:650;
  font-size:26px;
  line-height:1.18;
  margin:0 0 14px;
  color:var(--ink);
}

.body-text{
  font-size:15.5px;
  line-height:1.62;
  color:#3a332a;
  margin:0;
}

.foot-row{
  display:flex; align-items:center; justify-content:space-between;
  margin-top:22px; padding-top:14px;
  border-top:1px dashed var(--brass-faint);
}
.year{
  font-family:'IBM Plex Mono', monospace;
  font-size:11.5px; color:var(--ink-soft); letter-spacing:0.03em;
}
.actions{ display:flex; gap:10px; }
.actionbtn{
  border:1px solid var(--brass-faint);
  background:rgba(255,255,255,0.35);
  border-radius:20px;
  padding:6px 12px;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  color:var(--ink-soft);
  display:flex; align-items:center; gap:6px;
  cursor:pointer;
  transition:background 0.15s, color 0.15s, border-color 0.15s, transform 0.1s;
}
.actionbtn:active{ transform:scale(0.94); }
.actionbtn.save.active{
  background:#8B3A3A; color:#fff; border-color:#8B3A3A;
}
.actionbtn svg{ width:13px; height:13px; }

/* hint */
.hint{
  position:absolute; bottom:26px; left:0; right:0;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  color:rgba(237,230,214,0.6);
  font-family:'IBM Plex Mono', monospace;
  font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase;
  animation: floaty 1.8s ease-in-out infinite;
  pointer-events:none;
}
@keyframes floaty{
  0%,100%{ transform:translateY(0); opacity:0.55; }
  50%{ transform:translateY(-6px); opacity:0.95; }
}

/* toast */
.toast{
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(10px);
  background:#EDE6D6; color:#2B2620;
  font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:0.03em;
  padding:9px 16px; border-radius:20px; box-shadow:0 8px 24px rgba(0,0,0,0.4);
  opacity:0; transition:opacity 0.25s, transform 0.25s;
  z-index:50; pointer-events:none;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>

<script>
const ERA_COLORS = {
  antichita: '#B5622B',
  medioevo: '#4A5D3A',
  rinascimento: '#B8912B',

};
const ERA_LABELS = {

  medioevo: 'Medioevo',
  rinascimento: 'Rinascimento',
  moderna: 'Età moderna',
  contemporanea: 'Età contemporanea'
};
// staggered tab offsets per era, to mimic a real hanging-folder drawer
const ERA_TABTOP = {
  antichita: 40,
  medioevo: 110,
  rinascimento: 180,
  moderna: 250,
  contemporanea: 320
};

const SEED_FACTS = [
  {era:'antichita', year:'I sec. d.C.', title:'Pecunia non olet', text:"L'imperatore Vespasiano tassò l'urina raccolta dagli orinatoi pubblici di Roma, che veniva rivenduta a conciatori e lavandai. Quando il figlio Tito storse il naso davanti a quei guadagni, il padre gli fece annusare le monete e rispose che il denaro non ha odore."},
  {era:'antichita', year:'III sec. a.C.', title:'I libri requisiti in porto', text:"Ad Alessandria d'Egitto, le navi che attraccavano nel porto venivano controllate: se a bordo c'erano rotoli o manoscritti, questi venivano confiscati, copiati per la biblioteca reale e restituiti solo in copia, mentre l'originale restava agli archivi."},
  {era:'antichita', year:'I sec. a.C.', title:'Più vicina a noi che alle piramidi', text:"Cleopatra visse intorno al 30 a.C., circa 2500 anni dopo la costruzione della Grande Piramide di Giza. Dal suo tempo allo sbarco sulla Luna del 1969 sono invece passati meno di 2000 anni: è quindi cronologicamente più vicina a noi che alle piramidi."},
  {era:'antichita', year:'VII sec. a.C.', title:"L'educazione degli spartani", text:"A Sparta i ragazzi venivano sottratti alla famiglia a 7 anni per l'agoge, un addestramento collettivo fondato su disciplina estrema, resistenza fisica e vita in comune, pensato per formare soldati prima ancora che individui."},
  {era:'antichita', year:'I sec. d.C.', title:'Il velario del Colosseo', text:"Il Colosseo poteva ospitare fino a 50.000-80.000 spettatori e disponeva di un enorme telone, il velarium, azionato da marinai della flotta romana per proteggere il pubblico dal sole."},
  {era:'antichita', year:'V-IV millennio a.C.', title:'Riscaldamento a pavimento', text:"I romani svilupparono l'ipocausto, un sistema di riscaldamento a pavimento che faceva circolare aria calda sotto le terme, un'idea che riapparirà in Europa solo molti secoli dopo."},
  {era:'antichita', year:'XXVI sec. a.C.', title:'Operai, non schiavi', text:"Gli scavi del villaggio degli operai di Giza suggeriscono che le piramidi furono costruite in gran parte da lavoratori liberi e pagati, ben nutriti a carne e birra, smentendo il mito degli schiavi frustati."},
  {era:'antichita', year:'XVIII sec. a.C.', title:'Occhio per occhio', text:"Il Codice di Hammurabi, inciso su una stele in Babilonia intorno al 1750 a.C., è uno dei più antichi testi legali giunti fino a noi e stabiliva pene proporzionate al danno subito."},
  {era:'antichita', year:'776 a.C.', title:'Olimpiadi solo per uomini', text:"Alle antiche Olimpiadi greche le donne sposate non potevano nemmeno assistere alle gare, pena severe punizioni: solo le donne nubili erano ammesse come spettatrici in alcune città."},
  {era:'antichita', year:'I sec. d.C.', title:'La dieta dei gladiatori', text:"I gladiatori romani seguivano spesso una dieta a base di orzo e legumi, tanto da essere soprannominati hordearii, mangiatori d'orzo: un regime pensato per accumulare grasso protettivo sopra i muscoli."},
  {era:'antichita', year:'III millennio a.C.', title:'Il gioco più antico', text:"Il senet, ritrovato in tombe egizie di oltre 5000 anni fa, è uno dei giochi da tavolo più antichi conosciuti: veniva sepolto con i defunti come simbolo del viaggio nell'aldilà."},
  {era:'antichita', year:'I sec. a.C.', title:'Cesare e i pirati', text:"Da giovane, Giulio Cesare fu rapito dai pirati e tenuto in ostaggio. Una volta liberato dietro riscatto, tornò con una flotta, li catturò e li fece giustiziare, come aveva promesso loro per scherzo durante la prigionia."},
  {era:'antichita', year:'II sec. a.C.', title:'La nascita della pergamena', text:"Per limitare la crescita della rivale biblioteca di Pergamo, l'Egitto vietò l'esportazione di papiro. Pergamo rispose perfezionando un supporto in pelle animale, la pergamena, che prende il nome proprio dalla città."},
  {era:'antichita', year:'I sec. d.C.', title:'Il vero significato di vomitorium', text:"Nei teatri e anfiteatri romani i vomitoria non erano luoghi per vomitare, come vuole un mito diffuso, ma i passaggi attraverso cui la folla veniva rapidamente riversata dentro e fuori dagli spalti."},
  {era:'antichita', year:'III millennio a.C.', title:'Un pigmento sintetico antichissimo', text:"Il blu egizio, ottenuto da sabbia, rame e calce riscaldati, è considerato uno dei primi pigmenti sintetici della storia, creato migliaia di anni prima della nascita della chimica moderna."},
  {era:'antichita', year:'I sec. a.C.', title:'La posta di stato romana', text:"Augusto istituì il cursus publicus, un sistema di stazioni di cambio per cavalli e messaggeri che permetteva il trasporto rapido di comunicazioni ufficiali lungo tutto l'impero."},
  {era:'antichita', year:'490 a.C.', title:'La corsa che uccise', text:"La leggenda della maratona nasce dal messaggero Fidippide, che secondo la tradizione corse da Maratona ad Atene per annunciare la vittoria sui persiani, morendo per lo sforzo subito dopo."},
  {era:'antichita', year:'46 a.C.', title:"L'anno più lungo della storia", text:"Per far coincidere il nuovo calendario giuliano con le stagioni, Giulio Cesare fece durare il 46 a.C. ben 445 giorni: un periodo ricordato dagli storici come l'anno della confusione."},
  {era:'antichita', year:'V sec. a.C.', title:'Le strade regie persiane', text:"L'impero achemenide costruì un sistema di strade con stazioni di cambio cavalli che permetteva ai messaggeri reali di percorrere oltre 2000 km in circa una settimana."},
  {era:'antichita', year:'IV sec. a.C.', title:"L'oracolo che confondeva apposta", text:"L'oracolo di Delfi era famoso per dare responsi volutamente ambigui: al re Creso fu detto che, attaccando i persiani, avrebbe distrutto un grande impero. Fu il suo."},

  {era:'medioevo', year:'XIV sec.', title:'Quaranta giorni di attesa', text:"Durante le epidemie di peste, Venezia obbligava le navi in arrivo a restare ancorate al largo per 40 giorni prima di sbarcare merci e passeggeri. Da quel periodo, in veneziano quaranta giorni, nasce la parola quarantena."},
  {era:'medioevo', year:'XIV sec.', title:'Una superstizione pericolosa', text:"In alcune zone d'Europa i gatti, specialmente quelli neri, venivano associati alla stregoneria e uccisi per paura. Alcuni storici ipotizzano che la conseguente crescita della popolazione di ratti possa aver favorito la diffusione della peste, anche se il nesso diretto resta discusso."},
  {era:'medioevo', year:'XV sec.', title:"Un'armatura più leggera del previsto", text:"Un'armatura completa da torneo pesava in media 20-30 kg, distribuiti su tutto il corpo grazie a giunture snodate. Un cavaliere allenato poteva correre, montare a cavallo senza aiuto e persino fare capriole."},
  {era:'medioevo', year:'1088', title:"L'università più antica d'Europa", text:"L'Università di Bologna, fondata nel 1088, è considerata la più antica università del mondo occidentale ancora attiva. Nacque come libera associazione di studenti, che assumevano essi stessi i propri docenti."},
  {era:'medioevo', year:'X sec.', title:"L'Europa prima di Colombo", text:"I vichinghi raggiunsero le coste del Nord America, nell'attuale Terranova, circa 500 anni prima di Colombo, come testimoniano i resti dell'insediamento di L'Anse aux Meadows."},
  {era:'medioevo', year:'Medioevo', title:'Libri incatenati', text:"Nelle biblioteche monastiche medievali i manoscritti erano così preziosi da essere spesso incatenati agli scaffali, per evitare che venissero rubati o smarriti."},
  {era:'medioevo', year:'IX sec.', title:'Un imperatore che non sapeva scrivere bene', text:"Carlo Magno, pur promuovendo scuole e cultura in tutto il suo impero, secondo il suo biografo Eginardo non riuscì mai, da adulto, a imparare a scrivere in modo fluido."},
  {era:'medioevo', year:'Medioevo', title:'Tornei vietati dalla Chiesa', text:"I tornei cavallereschi causavano così tante morti tra i nobili che in diversi periodi la Chiesa ne proibì lo svolgimento, arrivando persino a negare sepoltura cristiana a chi moriva in combattimento."},
  {era:'medioevo', year:'1152', title:'Un matrimonio che cambiò la mappa', text:"Il matrimonio tra Enrico II d'Inghilterra ed Eleonora d'Aquitania unì territori tali da rendere il re inglese padrone di più terra in Francia di quanta ne possedesse il re francese stesso."},
  {era:'medioevo', year:'1347-1351', title:'La peste nera', text:"La peste nera del 1347-1351 uccise probabilmente tra un terzo e la metà della popolazione europea in pochi anni, trasformando profondamente economia e società del continente."},
  {era:'medioevo', year:'XI-XIII sec.', title:'Il lascito delle Crociate', text:"Le Crociate, oltre ai conflitti, favorirono in Europa la circolazione di spezie, zucchero di canna e nuove tecniche agricole e commerciali provenienti dal mondo islamico."},
  {era:'medioevo', year:'X sec.', title:'Un visir diventato regina', text:"Gli scacchi arrivarono in Europa dal mondo arabo-persiano. Nel passaggio culturale, il pezzo del visir persiano si trasformò progressivamente nella Regina, il pezzo più potente della scacchiera occidentale."},
  {era:'medioevo', year:'Rinascimento', title:'Un nome nato per disprezzo', text:"Il termine medioevo fu coniato secoli più tardi dagli umanisti rinascimentali per descrivere, con una certa sufficienza, il periodo intermedio tra l'antichità classica e la loro epoca."},
  {era:'medioevo', year:'VI sec.', title:'Il segreto della seta', text:"Secondo la tradizione, due monaci bizantini contrabbandarono uova di baco da seta dalla Cina nascoste in canne di bambù, permettendo la nascita della sericoltura in Europa."},
  {era:'medioevo', year:'1215', title:'Una carta nata da una ribellione', text:"La Magna Carta del 1215 non nacque da un ideale astratto di libertà, ma da una ribellione dei baroni inglesi contro Re Giovanni, e tutelava soprattutto i privilegi della nobiltà."},
  {era:'medioevo', year:'XII-XV sec.', title:'Cattedrali costruite in generazioni', text:"Le grandi cattedrali gotiche come Notre-Dame impiegarono spesso oltre un secolo per essere completate, coinvolgendo generazioni successive di architetti e scalpellini."},
  {era:'medioevo', year:'XIII sec.', title:'La posta a staffetta di Gengis Khan', text:"Gengis Khan istituì lo Yam, un sistema di stazioni di posta a cavallo che permetteva ai messaggeri di attraversare l'intero impero mongolo a velocità record per l'epoca."},
  {era:'medioevo', year:'XIV sec.', title:"Un'idea nata prima di Venezia", text:"L'isolamento delle navi in arrivo per prevenire il contagio era già praticato a Ragusa, l'attuale Dubrovnik, con un periodo di 30 giorni, qualche decennio prima della quarantena veneziana di 40."},
  {era:'medioevo', year:'Medioevo', title:'Donne a capo di botteghe', text:"In alcune città medievali inglesi, le donne sposate potevano gestire attività commerciali in proprio nome grazie allo status giuridico di femme sole, indipendente da quello del marito."},
  {era:'medioevo', year:'793', title:'Il terrore dal mare', text:"Il saccheggio del monastero di Lindisfarne nel 793 è tradizionalmente considerato l'inizio dell'età vichinga in Europa, l'evento che diffuse il terrore per i predoni scandinavi."},
  {era:'medioevo', year:'1054', title:'Uno scisma che dura ancora', text:"Nel 1054 la Chiesa cristiana si divise formalmente tra Chiesa cattolica romana e Chiesa ortodossa d'Oriente, una frattura religiosa e politica mai del tutto ricomposta."},

  {era:'rinascimento', year:'1455 circa', title:'Una Bibbia venduta come manoscritto', text:"Gutenberg stampò la sua celebre Bibbia intorno al 1455, ma inizialmente cercò di spacciarla per un manoscritto fatto a mano, ritenuto più pregiato agli occhi degli acquirenti dell'epoca."},
  {era:'rinascimento', year:'XV-XVI sec.', title:'Una scrittura allo specchio', text:"Leonardo da Vinci, mancino, riempì i suoi taccuini di annotazioni scritte da destra verso sinistra, leggibili solo riflesse in uno specchio, forse per comodità o per proteggere le sue idee."},
  {era:'rinascimento', year:'1508-1512', title:'In piedi, non sdraiato', text:"Contrariamente al mito diffuso, Michelangelo non dipinse il soffitto della Cappella Sistina sdraiato sulla schiena, ma in piedi su un'impalcatura di sua progettazione, con la testa reclinata all'indietro."},
  {era:'rinascimento', year:'XV-XVI sec.', title:'Uno scambio silenzioso', text:"Dopo i viaggi di Colombo, l'Europa vide la prima grande epidemia documentata di sifilide. Gli storici discutono ancora se la malattia arrivasse dalle Americhe o fosse già presente in forme meno virulente."},
  {era:'rinascimento', year:'XV sec.', title:'Il monumento mai fuso', text:"Leonardo da Vinci progettò per Ludovico il Moro il più grande monumento equestre mai concepito fino ad allora: il modello in argilla fu distrutto dai soldati francesi prima che potesse essere fuso in bronzo."},
  {era:'rinascimento', year:'1543', title:'Un libro pubblicato in punto di morte', text:"Copernico attese quasi fino alla morte per pubblicare la sua teoria eliocentrica, temendo le reazioni della Chiesa: ricevette la prima copia stampata del suo libro, secondo la tradizione, sul letto di morte."},
  {era:'rinascimento', year:'XV sec.', title:'Mecenati per interesse', text:"I Medici finanziarono artisti, architetti e scienziati non solo per amore della cultura, ma anche come strumento per consolidare il proprio potere politico ed economico su Firenze."},
  {era:'rinascimento', year:'1513', title:'Un trattato scritto in esilio', text:"Machiavelli scrisse Il Principe mentre era allontanato dalla vita politica fiorentina, nella speranza, mai realizzata, di essere richiamato al servizio dei Medici."},
  {era:'rinascimento', year:'1520', title:'Nato e morto lo stesso giorno', text:"Secondo la tradizione, Raffaello Sanzio morì a soli 37 anni proprio il giorno del suo compleanno, il 6 aprile 1520, un dettaglio che alimentò da subito il mito dell'artista."},
  {era:'rinascimento', year:'XVI sec.', title:'Bellezza a caro prezzo', text:"Le donne di ceto elevato del Rinascimento usavano spesso un cerone a base di biacca di piombo per schiarire la pelle, con gravi conseguenze sulla salute nel lungo periodo."},
  {era:'rinascimento', year:'1499-1502', title:"Un nome dato per errore di viaggio", text:"Amerigo Vespucci, da cui prende il nome il continente americano, non guidò mai ufficialmente una spedizione come comandante, ma vi partecipò come navigatore e ne scrisse resoconti molto diffusi."},
  {era:'rinascimento', year:'1571', title:'Uno scrittore in battaglia', text:"Alla battaglia navale di Lepanto del 1571 partecipò anche il giovane Miguel de Cervantes, futuro autore del Don Chisciotte, che vi perse l'uso della mano sinistra."},
  {era:'rinascimento', year:'1436', title:'Una cupola senza armature', text:"La cupola del Duomo di Firenze, progettata da Filippo Brunelleschi, fu costruita senza le tradizionali armature di legno interne, una soluzione ingegneristica considerata rivoluzionaria per l'epoca."},
  {era:'rinascimento', year:'XVI sec.', title:'Un naso di metallo', text:"L'astronomo Tycho Brahe perse parte del naso in un duello da giovane e ne portò per il resto della vita uno artificiale, probabilmente in una lega di rame e argento."},
  {era:'rinascimento', year:'XV-XVI sec.', title:'La prima donna del mondo', text:"Isabella d'Este fu una delle mecenati e collezioniste d'arte più influenti del Rinascimento, tanto da essere soprannominata dai contemporanei la prima donna del mondo."},
  {era:'rinascimento', year:'XV sec.', title:'Ossessionato dalla prospettiva', text:"Secondo Giorgio Vasari, il pittore Paolo Uccello era così ossessionato dallo studio della prospettiva da passare le notti a disegnare punti di fuga, con grande disappunto della moglie."},
  {era:'rinascimento', year:'1492', title:'Il nome sbagliato di un continente', text:"Colombo morì convinto di aver raggiunto le Indie orientali, errore che diede origine al nome improprio Indie occidentali con cui per secoli si indicarono le Americhe."},
  {era:'rinascimento', year:'1494', title:'Il mondo diviso in due', text:"Con il trattato di Tordesillas del 1494, papa e sovrani di Spagna e Portogallo si spartirono su una mappa ancora incompleta i futuri territori extraeuropei, tracciando una linea immaginaria sull'Atlantico."},
  {era:'rinascimento', year:'XVI sec.', title:"Un'invenzione che cambiò la guerra", text:"La diffusione delle armi da fuoco portatili nel Rinascimento rese progressivamente obsolete le pesanti armature dei cavalieri medievali, cambiando per sempre il volto dei campi di battaglia."},
  {era:'rinascimento', year:'1508', title:'Una committenza scomoda', text:"Michelangelo accettò la commissione della Cappella Sistina con riluttanza, ritenendosi principalmente uno scultore e non un pittore: il progetto durò comunque circa quattro anni."},
  {era:'rinascimento', year:'XVI sec.', title:'Il primo atlante moderno', text:"Nel 1570 il cartografo fiammingo Abraham Ortelius pubblicò il Theatrum Orbis Terrarum, considerato il primo vero atlante moderno con mappe uniformi rilegate insieme."},

  {era:'moderna', year:'1682-1789', title:'Una reggia per controllare i nobili', text:"Luigi XIV fece costruire Versailles anche come strumento politico, per obbligare l'aristocrazia francese a vivere a corte sotto il suo controllo, lontano dai propri feudi di provincia."},
  {era:'moderna', year:'XVIII sec.', title:"Un'imperatrice mai citata correttamente", text:"Maria Antonietta non pronunciò probabilmente mai la celebre frase che mangino brioche: la citazione le fu attribuita solo decenni dopo la sua morte, e circolava già prima riferita ad altre nobildonne."},
  {era:'moderna', year:'1789', title:'Una fortezza quasi vuota', text:"Al momento del celebre assalto del 14 luglio 1789, la Bastiglia di Parigi custodiva soltanto sette prigionieri, ben lontana dall'immagine di prigione politica gremita tramandata dalla propaganda rivoluzionaria."},
  {era:'moderna', year:'1807', title:"L'imperatore assediato dai conigli", text:"Il maresciallo Berthier organizzò per Napoleone una battuta di caccia ai conigli, acquistati d'allevamento anziché selvatici. Abituati alla presenza umana, gli animali caricarono in massa l'imperatore scambiandolo per chi portava il cibo."},
  {era:'moderna', year:'1752', title:'Undici giorni scomparsi', text:"Quando la Gran Bretagna adottò il calendario gregoriano nel settembre 1752, al 2 settembre seguì direttamente il 14: alcuni cittadini, secondo la tradizione popolare, protestarono convinti che qualcuno avesse loro rubato quei giorni di vita."},
  {era:'moderna', year:'1889-1909', title:'Salvata dalla radio', text:"La Torre Eiffel fu costruita per l'Esposizione Universale del 1889 con un permesso di soli 20 anni. Fu risparmiata dalla demolizione perché utile come supporto per antenne di telegrafia e radio militare."},
  {era:'moderna', year:'1793', title:'Un giorno diviso in dieci', text:"Durante la Rivoluzione Francese fu introdotto per alcuni anni un calendario decimale, con settimane di 10 giorni e giornate divise in 10 ore da 100 minuti, poi abbandonato per l'impraticabilità quotidiana."},
  {era:'moderna', year:'XVIII sec.', title:"Un'invenzione nata dal carbone", text:"La rivoluzione industriale iniziò in Gran Bretagna anche grazie all'abbondanza di carbone a basso costo e alla disponibilità di capitali privati pronti a essere investiti in nuove macchine."},
  {era:'moderna', year:'1752', title:'Un aquilone e una chiave', text:"Il celebre esperimento di Benjamin Franklin con aquilone e chiave durante un temporale, usato per studiare l'elettricità atmosferica, ci è giunto in una versione probabilmente semplificata rispetto ai fatti reali."},
  {era:'moderna', year:'1756-1763', title:'Il primo conflitto globale', text:"La guerra dei sette anni, combattuta su più continenti tra le grandi potenze europee e le loro colonie, è considerata da alcuni storici il primo vero conflitto su scala mondiale."},
  {era:'moderna', year:'XVIII sec.', title:"Un tè più sicuro dell'acqua", text:"Il tè divenne centrale nella cultura inglese anche perché, essendo preparato con acqua bollita, risultava spesso più sicuro da bere dell'acqua corrente non depurata dell'epoca."},
  {era:'moderna', year:'XVIII sec.', title:'Un esercito privato', text:"La Compagnia britannica delle Indie Orientali arrivò a disporre di un proprio esercito privato più numeroso di quello di molti stati sovrani europei del tempo."},
  {era:'moderna', year:'XVI sec.', title:'La forchetta, un capriccio raffinato', text:"Caterina de' Medici contribuì a diffondere in Francia l'uso della forchetta, inizialmente considerata più un vezzo aristocratico che uno strumento da tavola necessario."},
  {era:'moderna', year:'1665-1666', title:'Scoperte nate dalla quarantena', text:"Isaac Newton sviluppò gran parte delle sue intuizioni sulla gravità durante un lungo periodo di isolamento forzato nella tenuta di famiglia, quando l'università di Cambridge chiuse per un'epidemia di peste."},
  {era:'moderna', year:'XVI-XIX sec.', title:'Un commercio a tre punte', text:"Il commercio triangolare atlantico collegava Europa, Africa e Americhe, e fu alla base della tratta transatlantica degli esseri umani ridotti in schiavitù per oltre tre secoli."},
  {era:'moderna', year:'1768-1779', title:'Le coste disegnate con precisione', text:"James Cook mappò con straordinaria accuratezza per l'epoca ampie porzioni delle coste del Pacifico, contribuendo enormemente alla cartografia mondiale del XVIII secolo."},
  {era:'moderna', year:'1636-1637', title:'Un bulbo più caro di una casa', text:"Durante la cosiddetta tulipomania nei Paesi Bassi, il prezzo di alcuni bulbi di tulipano rari superò quello di case signorili, prima di un crollo improvviso del mercato nel 1637."},
  {era:'moderna', year:'1792', title:'Un nome legato a un dibattito', text:"La ghigliottina fu proposta come metodo di esecuzione più rapido e uniforme rispetto ai metodi precedenti, e prese il nome dal medico Joseph-Ignace Guillotin, che ne sostenne l'adozione in parlamento."},
  {era:'moderna', year:'1650', title:'Il primo vero quotidiano', text:"Il titolo di primo giornale quotidiano regolare d'Europa spetta all'Einkommende Zeitungen, pubblicato a Lipsia a partire dal 1650."},
  {era:'moderna', year:'1791-1804', title:'La prima repubblica di ex schiavi', text:"La rivoluzione haitiana portò nel 1804 alla nascita della prima repubblica indipendente della storia moderna guidata da persone precedentemente ridotte in schiavitù."},

  {era:'contemporanea', year:'1930', title:'Un primato durato 41 anni', text:"La Torre Eiffel rimase l'edificio più alto del mondo per soli 41 anni, prima di essere superata dal Chrysler Building di New York nel 1930."},
  {era:'contemporanea', year:'1914', title:'La tregua di Natale', text:"Durante la Prima Guerra Mondiale, nel dicembre 1914, soldati nemici in alcuni tratti del fronte scesero spontaneamente nella terra di nessuno per scambiarsi doni e giocare a pallone insieme."},
  {era:'contemporanea', year:'1912', title:'Scialuppe insufficienti', text:"Il Titanic trasportava scialuppe di salvataggio sufficienti per meno della metà delle persone a bordo, pur rispettando pienamente le normative marittime in vigore all'epoca."},
  {era:'contemporanea', year:'1928', title:'Una scoperta quasi casuale', text:"Alexander Fleming scoprì la penicillina nel 1928 quasi per caso, notando che una muffa aveva contaminato una delle sue colture batteriche impedendone la crescita."},
  {era:'contemporanea', year:'1903', title:'Dodici secondi che cambiarono tutto', text:"Il primo volo a motore dei fratelli Wright nel 1903 durò appena dodici secondi e percorse una distanza inferiore alla lunghezza di un moderno aereo di linea."},
  {era:'contemporanea', year:'Guerra Fredda', title:'Arsenali capaci di distruggere il mondo', text:"Durante la Guerra Fredda, Stati Uniti e Unione Sovietica accumularono migliaia di testate nucleari, arrivando a un potenziale distruttivo sufficiente a colpire il pianeta più volte."},
  {era:'contemporanea', year:'Seconda guerra mondiale', title:'Il Monopoly delle spie', text:"I servizi segreti britannici fecero produrre versioni speciali del gioco Monopoly con mappe, bussole e denaro reale nascosti dentro, inviate ai prigionieri di guerra alleati per aiutarne la fuga."},
  {era:'contemporanea', year:'1955', title:'Un simbolo, non un inizio', text:"Rosa Parks non fu la prima donna afroamericana arrestata per essersi rifiutata di cedere il posto su un autobus, ma la sua vicenda del 1955 divenne il simbolo del movimento per i diritti civili statunitense."},
  {era:'contemporanea', year:'1945', title:'Ventisette tonnellate di calcolo', text:"L'ENIAC, il primo computer completamente elettronico, pesava circa 27 tonnellate e occupava una stanza intera, pur avendo una potenza di calcolo inferiore a quella di un moderno smartphone."},
  {era:'contemporanea', year:'1969', title:'Meno potenza di una calcolatrice', text:"Il computer di bordo della missione Apollo 11 disponeva di una potenza di calcolo enormemente inferiore a quella di una moderna calcolatrice tascabile."},
  {era:'contemporanea', year:'1974', title:"Una guerra finita in ritardo", text:"Alcuni soldati giapponesi rimasero nascosti nella giungla per decenni dopo la fine della Seconda Guerra Mondiale, convinti che il conflitto fosse ancora in corso: l'ultimo si arrese solo nel 1974."},
  {era:'contemporanea', year:'XIX sec.', title:'Un tonico da farmacia', text:"La Coca-Cola fu inizialmente venduta come tonico medicinale nelle farmacie statunitensi di fine Ottocento, prima di trasformarsi nella bevanda di massa che conosciamo oggi."},
  {era:'contemporanea', year:'1941', title:'Ispirato dai semi di bardana', text:"L'ingegnere svizzero George de Mestral inventò il velcro osservando come i piccoli ganci dei semi di bardana si attaccassero ai vestiti e al pelo del suo cane durante una passeggiata."},
  {era:'contemporanea', year:'1992', title:'Il primo SMS della storia', text:"Il 3 dicembre 1992 l'ingegnere Neil Papworth inviò il primo SMS della storia da un computer a un telefono cellulare: il testo diceva semplicemente Merry Christmas."},
  {era:'contemporanea', year:'1952', title:'La presidenza rifiutata', text:"Nel 1952 ad Albert Einstein fu offerta la carica di presidente dello Stato d'Israele. Einstein rifiutò, dichiarandosi privo dell'attitudine necessaria a trattare con le persone e a esercitare funzioni ufficiali."},
  {era:'contemporanea', year:'1989', title:'Una caduta annunciata per errore', text:"Il 9 novembre 1989 il portavoce della Germania Est Günter Schabowski, per un fraintendimento in conferenza stampa, lasciò intendere che i confini fossero aperti da subito: la folla si precipitò ai valichi quella stessa notte."},
  {era:'contemporanea', year:'1993', title:'Un regalo al mondo', text:"Nell'aprile 1993 il CERN di Ginevra rese pubblica e gratuita la tecnologia del World Wide Web, sviluppata da Tim Berners-Lee, rinunciando a qualsiasi royalty e permettendo al web di diffondersi liberamente."},
  {era:'contemporanea', year:'1992', title:'La prima foto caricata sul web', text:"La prima immagine caricata sul World Wide Web ritraeva le Les Horribles Cernettes, un gruppo musicale scherzoso formato da ricercatrici del CERN, pubblicata da Tim Berners-Lee come esempio pratico."},
  {era:'contemporanea', year:'Seconda guerra mondiale', title:'Supereroi in tempo di guerra', text:"Il fumetto dei supereroi crebbe rapidamente durante la Seconda Guerra Mondiale anche come strumento di propaganda: già nel 1941 Captain America appariva in copertina mentre colpiva Hitler."},
  {era:'contemporanea', year:'1990', title:'Un francobollo diventato leggenda', text:"Nel 1990 il servizio postale statunitense distrusse per errore quasi tutti i fogli di un francobollo con Bugs Bunny stampato al contrario, rendendo i pochi esemplari sopravvissuti rarità da collezione."},
{era:'antichita', year:'IX sec. a.C.', title:'Una città fondata da una regina', text:"Secondo la leggenda, Cartagine fu fondata dalla principessa fenicia Didone, che ottenne dai locali tanta terra quanta ne poteva racchiudere con la pelle di un bue: la tagliò in strisce sottilissime per delimitare un intero colle."},
  {era:'antichita', year:'V sec. a.C.', title:'Trecento, non solo trecento', text:"Alla battaglia delle Termopili, oltre ai celebri 300 spartani, combatterono anche migliaia di altri greci alleati, spesso dimenticati dalla narrazione popolare del mito."},
  {era:'antichita', year:'II millennio a.C.', title:'Una scrittura mai decifrata del tutto', text:"La scrittura della Valle dell'Indo, usata dalla civiltà di Harappa oltre 4000 anni fa, non è ancora stata decifrata con certezza dagli studiosi moderni."},
  {era:'antichita', year:'146 a.C.', title:'Il sale sparso su Cartagine', text:"Una leggenda tramandata da storici moderni vuole che i romani abbiano cosparso di sale le rovine di Cartagine dopo la sua distruzione: la pratica non è però confermata da fonti antiche coeve."},
  {era:'antichita', year:'IV sec. a.C.', title:'Un impero costruito in 13 anni', text:"Alessandro Magno costruì uno dei più vasti imperi della storia in appena tredici anni di campagne militari, prima di morire a Babilonia a soli 32 anni."},
  {era:'antichita', year:'V sec. a.C.', title:'La democrazia con esclusioni', text:"La democrazia ateniese escludeva dal voto donne, stranieri e schiavi, riducendo il corpo elettorale reale a una minoranza della popolazione della città."},
  {era:'antichita', year:'753 a.C.', title:'Una data convenzionale', text:"La data tradizionale della fondazione di Roma, il 753 a.C., fu calcolata secoli dopo dallo storico Varrone e ha valore più simbolico che storicamente certo."},
  {era:'antichita', year:'I sec. d.C.', title:'Un vulcano che conservò una città', text:"L'eruzione del Vesuvio del 79 d.C. distrusse Pompei, ma la coltre di cenere che la ricoprì ne conservò per secoli edifici, oggetti quotidiani e persino i calchi dei corpi delle vittime."},
  {era:'antichita', year:'III sec. a.C.', title:'Un matematico e una vasca da bagno', text:"Secondo la tradizione, Archimede intuì il principio della spinta idrostatica mentre entrava in una vasca da bagno, correndo poi nudo per le strade di Siracusa gridando eureka."},
  {era:'antichita', year:'IV sec. a.C.', title:'Una biblioteca ambulante', text:"Aristotele fondò il Liceo ad Atene, una scuola che comprendeva anche una delle prime raccolte sistematiche di testi scientifici e filosofici del mondo antico."},
  {era:'antichita', year:'480 a.C.', title:'Una flotta decisiva', text:"La battaglia navale di Salamina del 480 a.C. vide la flotta greca, numericamente inferiore, sconfiggere quella persiana sfruttando la conoscenza dello stretto e delle correnti locali."},
  {era:'antichita', year:'I sec. a.C.', title:'Un console diventato dittatore a vita', text:"Giulio Cesare si fece nominare dittatore a vita nel 44 a.C., pochi mesi prima di essere assassinato dai senatori che temevano la fine della repubblica romana."},
  {era:'antichita', year:'VIII sec. a.C.', title:'Un poema tramandato oralmente', text:"L'Iliade e l'Odissea furono probabilmente tramandate oralmente per generazioni prima di essere messe per iscritto, il che spiega molte delle loro formule ripetute, utili alla memorizzazione."},
  {era:'antichita', year:'IV sec. a.C.', title:'Un filosofo condannato a morte', text:"Socrate fu condannato a morte ad Atene con l'accusa di corrompere i giovani e non riconoscere gli dei della città, e scelse di bere la cicuta piuttosto che fuggire."},
  {era:'antichita', year:'27 a.C.', title:'Un impero nato da una repubblica', text:"Augusto trasformò gradualmente la Repubblica romana in un impero, mantenendo formalmente le istituzioni repubblicane ma accentrando su di sé i poteri reali."},
  {era:'antichita', year:'V sec. a.C.', title:'Un muro contro i persiani', text:"Dopo le guerre persiane, Atene costruì le Lunghe Mura per collegare la città al porto del Pireo, garantendo l'approvvigionamento anche durante un eventuale assedio via terra."},
  {era:'antichita', year:'II sec. a.C.', title:'Un meccanismo avanzatissimo', text:"Il meccanismo di Anticitera, un dispositivo greco antico ritrovato in un relitto, è considerato un calcolatore astronomico analogico di straordinaria complessità per la sua epoca."},
  {era:'antichita', year:'509 a.C.', title:'La cacciata di un re', text:"La tradizione romana fa coincidere la nascita della Repubblica con la cacciata dell'ultimo re, Tarquinio il Superbo, nel 509 a.C."},
  {era:'antichita', year:'I sec. d.C.', title:'Un impero senza mappe precise', text:"Nonostante l'estensione dell'impero romano, la cartografia antica restava spesso imprecisa: le mappe servivano più a orientare i viaggiatori lungo le strade che a rappresentare fedelmente i territori."},
  {era:'antichita', year:'776 a.C.', title:'Una tregua sacra', text:"Durante le antiche Olimpiadi veniva proclamata una tregua sacra tra le città greche in guerra, per permettere ad atleti e spettatori di raggiungere Olimpia in sicurezza."},

  {era:'medioevo', year:'800', title:"Un'incoronazione a sorpresa", text:"Secondo alcune fonti medievali, Carlo Magno non sapeva che sarebbe stato incoronato imperatore dal papa durante la messa di Natale dell'800, anche se molti storici dubitano di questa versione."},
  {era:'medioevo', year:'1066', title:'Una conquista raccontata a fili', text:"La conquista normanna dell'Inghilterra del 1066 è narrata nell'arazzo di Bayeux, un lungo ricamo che rappresenta gli eventi come un vero e proprio fumetto medievale."},
  {era:'medioevo', year:'1206-1227', title:'Un impero nato dalla steppa', text:"Gengis Khan unificò le tribù mongole e costruì in pochi decenni il più vasto impero contiguo della storia, esteso dalla Cina all'Europa orientale."},
  {era:'medioevo', year:'IX-X sec.', title:'Un califfato culla del sapere', text:"Durante il califfato abbaside, Baghdad ospitò la Casa della Saggezza, un centro di traduzione e studio che preservò e ampliò il sapere greco, persiano e indiano."},
  {era:'medioevo', year:'1347', title:'Il contagio arrivato dal mare', text:"La peste nera raggiunse l'Europa nel 1347 attraverso navi genovesi arrivate a Messina con equipaggi già decimati dalla malattia, diffondendosi rapidamente lungo le rotte commerciali."},
  {era:'medioevo', year:'1204', title:'Una crociata contro cristiani', text:"La quarta crociata, partita per liberare Gerusalemme, deviò e saccheggiò invece Costantinopoli nel 1204, indebolendo gravemente l'impero bizantino cristiano."},
  {era:'medioevo', year:'1347-1351', title:'Un mondo del lavoro trasformato', text:"La forte riduzione della popolazione causata dalla peste nera aumentò il potere contrattuale dei lavoratori superstiti, contribuendo indirettamente al declino del sistema feudale in Europa."},
  {era:'medioevo', year:'711', title:'Una conquista rapidissima', text:"Le forze omayyadi conquistarono la maggior parte della penisola iberica in pochi anni a partire dal 711, dando inizio a quasi otto secoli di presenza islamica in Spagna."},
  {era:'medioevo', year:'1291', title:'La fine di un regno crociato', text:"La caduta di San Giovanni d'Acri nel 1291 segnò la fine degli stati crociati in Terrasanta, dopo quasi due secoli di presenza latina nella regione."},
  {era:'medioevo', year:'1350 circa', title:'Occhiali prima della stampa', text:"Gli occhiali con lenti convesse furono inventati in Italia intorno alla fine del XIII secolo, oltre un secolo prima della diffusione della stampa a caratteri mobili."},
  {era:'medioevo', year:'1215', title:'Un concilio che regolò la vita quotidiana', text:"Il Quarto Concilio Lateranense del 1215 impose regole dettagliate sulla vita religiosa dei fedeli, inclusa la confessione annuale obbligatoria."},
  {era:'medioevo', year:'IX sec.', title:'Un regno diviso in tre', text:"Il trattato di Verdun dell'843 divise l'impero carolingio tra i nipoti di Carlo Magno, gettando le basi per i futuri confini di Francia, Germania e delle terre intermedie."},
  {era:'medioevo', year:'1381', title:'Una rivolta contadina', text:"La rivolta dei contadini inglesi del 1381, guidata da Wat Tyler, nacque dal malcontento per le tasse imposte dopo la peste nera e portò migliaia di persone a marciare su Londra."},
  {era:'medioevo', year:'1054-1204', title:'Un impero che resisteva da secoli', text:"L'impero bizantino sopravvisse per un millennio dopo la caduta dell'impero romano d'Occidente, preservando lingua greca, diritto romano e cultura classica."},
  {era:'medioevo', year:'1347-1351', title:'Un dottore con il becco', text:"I medici della peste indossavano maschere a forma di becco riempite di erbe aromatiche, nella convinzione errata che i miasmi, ovvero l'aria cattiva, fossero la causa del contagio."},
  {era:'medioevo', year:'1215-1250', title:'Un imperatore poliglotta', text:"Federico II di Svevia, soprannominato stupor mundi, parlava correntemente più lingue e fu mecenate di scienze, poesia e filosofia in un'epoca spesso considerata solo oscurantista."},
  {era:'medioevo', year:'1000 circa', title:'Un anno mille senza panico globale', text:"Contrariamente a un mito diffuso in epoca moderna, non ci sono prove solide di un diffuso terrore collettivo per la fine del mondo in Europa nell'anno 1000."},

function shuffleArray(arr){
  for (let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Alterna le epoche a rotazione invece di affidarsi solo al caso: un mescolamento
// puramente casuale può comunque produrre per caso lunghe sequenze della stessa epoca.
function interleaveByEra(facts){
  const buckets = {};
  facts.forEach(f => {
    if (!buckets[f.era]) buckets[f.era] = [];
    buckets[f.era].push(f);
  });
  Object.values(buckets).forEach(shuffleArray);
  const eraKeys = shuffleArray(Object.keys(buckets));
  const result = [];
  let remaining = true;
  while (remaining){
    remaining = false;
    for (const era of eraKeys){
      if (buckets[era] && buckets[era].length){
        result.push(buckets[era].shift());
        remaining = true;
      }
    }
  }
  return result;
}

// ---------- Wikipedia "accadde oggi" extension ----------
// Estende l'archivio con eventi storici reali presi dall'API pubblica di Wikipedia
// (licenza CC BY-SA). Se non è raggiungibile (offline, file aperto localmente, ecc.)
// l'app continua a funzionare solo con le curiosità locali qui sopra.
const WIKI_BASE = 'https://it.wikipedia.org/api/rest_v1/feed/onthisday/all/';
let wikiEnabled = true;
let wikiFetchInFlight = false;
let wikiQueue = [];
let wikiQueuePos = 0;

function buildWikiQueue(){
  const daysInMonth = [31,29,31,30,31,30,31,31,30,31,30,31]; // 29 per includere il 29 febbraio
  const pairs = [];
  for (let m = 1; m <= 12; m++){
    for (let d = 1; d <= daysInMonth[m-1]; d++) pairs.push([m, d]);
  }
  return shuffleArray(pairs);
}

function mapYearToEra(year){
  if (year < 500) return 'antichita';
  if (year < 1450) return 'medioevo';
  if (year < 1650) return 'rinascimento';
  if (year < 1900) return 'moderna';
  return 'contemporanea';
}
function formatWikiYear(year){
  return year < 0 ? `${Math.abs(year)} a.C.` : String(year);
}

async function fetchWikiDay(month, day){
  const mm = String(month).padStart(2, '0');
  const dd = String(day).padStart(2, '0');
  // niente header personalizzati qui: da browser farebbero scattare un preflight CORS
  // che l'API pubblica di Wikipedia potrebbe non consentire, bloccando l'intera richiesta.
  const res = await fetch(WIKI_BASE + mm + '/' + dd);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  const raw = [].concat(data.selected || [], data.events || []);
  const seen = new Set();
  const out = [];
  raw.forEach((item, idx) => {
    if (!item || !item.text || typeof item.year !== 'number') return;
    const key = item.year + '|' + item.text.slice(0, 40);
    if (seen.has(key)) return;
    seen.add(key);
    const page = (item.pages || []).find(p => p && p.title);
    const title = page ? page.title.replace(/_/g, ' ') : (item.text.slice(0, 50).trim() + '…');
    out.push({
      id: 'wiki-' + mm + dd + '-' + item.year + '-' + idx,
      era: mapYearToEra(item.year),
      year: formatWikiYear(item.year),
      title,
      text: item.text,
      source: 'wikipedia'
    });
  });
  return out;
}

// Recupera altri giorni finché non aggiunge almeno "minNeeded" nuove voci,
// oppure si ferma e si autodisabilita se l'API non è raggiungibile.
async function topUpFromWikipedia(minNeeded){
  let added = 0;
  let attempts = 0;
  const maxAttempts = 40; // limite di sicurezza: mai più di 40 giorni per singolo rifornimento
  const newBatch = [];
  try {
    while (added < minNeeded && attempts < maxAttempts){
      attempts++;
      if (wikiQueuePos >= wikiQueue.length) wikiQueuePos = 0; // ricomincia il giro dell'anno
      const [m, d] = wikiQueue[wikiQueuePos++];
      const dayFacts = await fetchWikiDay(m, d);
      if (dayFacts.length){
        newBatch.push(...dayFacts);
        added += dayFacts.length;
      }
    }
  } catch (e) {
    console.error('Wikipedia non raggiungibile, disattivo l\'estensione', e);
    wikiEnabled = false;
    showToast('Contenuti extra da Wikipedia non disponibili ora: continuo con l\'archivio locale');
  }
  if (newBatch.length){
    FACTS = FACTS.concat(interleaveByEra(newBatch)); // alternanza vera anche qui, non solo casuale
  }
}

  slide.innerHTML = `

      <h2 class="title"></h2>
      <p class="body-text"></p>
      ${fromWiki ? `<div class="wiki-source"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span>Fonte: Wikipedia, CC BY-SA</span></div>` : ''}
      <div class="foot-row">
        <span class="year"></span>
        <div class="actions">
          <button class="actionbtn save${isSaved ? ' active' : ''}" data-id="${fact.id}">${heartIcon(isSaved)}<span>${isSaved ? 'salvata' : 'salva'}</span></button>
          <button class="actionbtn share" data-id="${fact.id}">${shareIcon}<span>condividi</span></button>
        </div>
      </div>
    </div>
    ${i === 0 ? '<div class="hint">scorri per scoprire ↑</div>' : ''}
  `;
  slide.querySelector('.title').textContent = fact.title;
  slide.querySelector('.body-text').textContent = fact.text;
  slide.querySelector('.year').textContent = fact.year;
  return slide;
}

// fade-in + progress bar color, tracks whichever card is centered
const viewObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting && entry.intersectionRatio > 0.6){
      entry.target.classList.add('in-view');
      const fact = FACTS.find(f => f.id === entry.target.dataset.id);
      if (fact && progressThumb) progressThumb.style.background = ERA_COLORS[fact.era] || '#8C7A54';
      const hintEl = document.querySelector('.hint');
      if (hintEl && entry.target.dataset.id !== FACTS[0].id){
        hintEl.style.opacity = '0';
      }
    }
  });
}, { threshold: [0, 0.6] });

// infinite-scroll style batch loading: renders more cards as the user approaches the end
let sentinel = null;
const loadMoreObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => { if (entry.isIntersecting) renderNextBatch(); });
}, { rootMargin: '1200px 0px' });

function renderNextBatch(){
  const start = renderedCount;
  const end = Math.min(FACTS.length, start + BATCH_SIZE);
  const justRendered = end - start;

  for (let i = start; i < end; i++){
    const slide = buildSlide(FACTS[i], i);
    feed.appendChild(slide);
    viewObserver.observe(slide);
  }
  renderedCount = end;
  updateCounter();

  const remaining = FACTS.length - renderedCount;
  if (wikiEnabled && remaining < BATCH_SIZE * 3 && !wikiFetchInFlight){
    wikiFetchInFlight = true;
    topUpFromWikipedia(BATCH_SIZE * 4).finally(() => {
      wikiFetchInFlight = false;
      renderNextBatch(); // riprende da dove era rimasto, ora che ci sono nuove schede (se sono arrivate)
    });
  }

  if (sentinel){ loadMoreObserver.unobserve(sentinel); sentinel = null; }
  // riosserva solo se abbiamo davvero aggiunto schede e non c'è già un fetch in corso:
  // se c'è un fetch in corso, sarà il suo .finally() a richiamare renderNextBatch quando pronto
  if (justRendered > 0 && !wikiFetchInFlight && feed.lastElementChild){
    sentinel = feed.lastElementChild;
    loadMoreObserver.observe(sentinel);
  }
}

function updateProgressOnScroll(){
  const track = document.getElementById('progressTrack');
  if (!track || !progressThumb) return;
  const trackH = track.clientHeight - progressThumb.clientHeight;
  const max = feed.scrollHeight - feed.clientHeight;
  const frac = max > 0 ? feed.scrollTop / max : 0;
  progressThumb.style.top = Math.min(trackH, Math.max(0, frac * trackH)) + 'px';
}
let scrollTicking = false;
feed.addEventListener('scroll', () => {
  if (!scrollTicking){
    requestAnimationFrame(() => { updateProgressOnScroll(); scrollTicking = false; });
    scrollTicking = true;
  }
});

// ---------- barra laterale trascinabile: scorrimento rapido su/giù, anche fino in fondo ----------
const progressTrackEl = document.getElementById('progressTrack');
let isDraggingProgress = false;

function jumpFeedToPointer(clientY){
  const rect = progressTrackEl.getBoundingClientRect();
  const frac = Math.min(1, Math.max(0, (clientY - rect.top) / rect.height));
  const max = feed.scrollHeight - feed.clientHeight;
  feed.scrollTop = frac * max;
}

progressTrackEl.addEventListener('pointerdown', (e) => {
  isDraggingProgress = true;
  progressTrackEl.classList.add('dragging');
  feed.style.scrollSnapType = 'none'; // niente "scatti" mentre si trascina
  try { progressTrackEl.setPointerCapture(e.pointerId); } catch(err){}
  jumpFeedToPointer(e.clientY);
  e.preventDefault();
});
progressTrackEl.addEventListener('pointermove', (e) => {
  if (!isDraggingProgress) return;
  jumpFeedToPointer(e.clientY);
});
function endProgressDrag(e){
  if (!isDraggingProgress) return;
  isDraggingProgress = false;
  progressTrackEl.classList.remove('dragging');
  feed.style.scrollSnapType = '';
  try { progressTrackEl.releasePointerCapture(e.pointerId); } catch(err){}
}
progressTrackEl.addEventListener('pointerup', endProgressDrag);
progressTrackEl.addEventListener('pointercancel', endProgressDrag);

async function loadSaved(){
  if (!HAS_STORAGE) return;
  try {
    const result = await window.storage.get(SAVED_KEY, false);
    if (result && result.value){
      const ids = JSON.parse(result.value);
      if (Array.isArray(ids)) ids.forEach(id => saved.add(id));
    }
  } catch (e) {
    // nessun preferito salvato in precedenza
  }
}
async function persistSaved(){
  if (!HAS_STORAGE) return;
  try {
    await window.storage.set(SAVED_KEY, JSON.stringify(Array.from(saved)), false);
  } catch (e) {
    console.error('Errore nel salvataggio dei preferiti', e);
  }
}

feed.addEventListener('click', (e) => {
  const saveBtn = e.target.closest('.save');
  const shareBtn = e.target.closest('.share');

  if (saveBtn){
    const id = saveBtn.dataset.id;
    if (saved.has(id)){
      saved.delete(id);
      saveBtn.classList.remove('active');
      saveBtn.innerHTML = heartIcon(false) + '<span>salva</span>';
    } else {
      saved.add(id);
      saveBtn.classList.add('active');
      saveBtn.innerHTML = heartIcon(true) + '<span>salvata</span>';
    }
    updateCounter();
    persistSaved();
  }

  if (shareBtn){
    const id = shareBtn.dataset.id;
    const fact = FACTS.find(f => f.id === id);
    if (!fact) return;
    const text = `${fact.title} (${fact.year}) — ${fact.text}`;
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text)
        .then(() => showToast('Copiato negli appunti'))
        .catch(() => showToast('Impossibile copiare'));
    } else {
      showToast('Copia non disponibile');
    }
  }
});

// ---------- init ----------
(async function init(){
  wikiQueue = buildWikiQueue();

  if (location.protocol === 'file:'){
    // da file:// molti browser bloccano le richieste verso altri domini per motivi di sicurezza:
    // niente tentativi falliti silenziosi, meglio dirlo chiaramente da subito.
    wikiEnabled = false;
    setTimeout(() => showToast('Wikipedia extra richiede di aprire la pagina da un indirizzo web (non da file locale)'), 900);
  }

  await loadSaved();
  updateCounter();
  renderNextBatch();

  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(() => {
      // non blocca l'app: continua a funzionare, solo senza le funzionalità offline avanzate
    });
  }
})();
</script>
</body>
</html>
